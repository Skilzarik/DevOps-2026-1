# Единственная точка входа: клиент -> nginx -> один из экземпляров приложения.
# Приложение и БД портов наружу не публикуют.

# Ограничение частоты: не более 10 запросов в секунду с одного адреса (всплеск до 30)
limit_req_zone $binary_remote_addr zone=perip:10m rate=10r/s;
limit_req_status 429;

upstream music_app {
    # Распределение по кругу (round-robin).
    # Пассивное исключение неработающего узла: 2 ошибки подряд убирают его на 10 секунд.
    server app1:8000 max_fails=2 fail_timeout=10s;
    server app2:8000 max_fails=2 fail_timeout=10s;
}

server {
    listen 8080;
    server_name _;
    server_tokens off;

    # Проверка самого nginx (для healthcheck контейнера)
    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        limit_req zone=perip burst=30 nodelay;

        proxy_pass http://music_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 2s;
        proxy_read_timeout 30s;

        # Повтор запроса на другом экземпляре при сбое соединения или таймауте.
        # POST/PATCH по умолчанию не повторяются: продажа не оформится дважды.
        # Ответ 503 приложения (БД недоступна) НЕ повторяется и доходит до клиента как есть.
        proxy_next_upstream error timeout http_502 http_504;
        proxy_next_upstream_tries 2;
    }
}
