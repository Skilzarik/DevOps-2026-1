# Контейнерное окружение: nginx -> два экземпляра приложения -> PostgreSQL.
# Запуск: make up. Настройки и пароли берутся из .env.docker (в git его нет).
name: music-store

# Общие параметры экземпляров приложения
x-app-common: &app-common
  image: music-store:${APP_VERSION:?Задайте APP_VERSION в .env.docker}
  restart: unless-stopped
  init: true
  read_only: true
  tmpfs:
    - /tmp
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  stop_grace_period: 30s
  networks:
    - backend
  depends_on:
    db:
      condition: service_healthy
    migrate:
      condition: service_completed_successfully
  deploy:
    resources:
      limits:
        cpus: "0.50"
        memory: 256M
        pids: 200
      reservations:
        memory: 64M

x-app-environment: &app-environment
  DATABASE_URL: postgresql+psycopg://appuser:${APP_DB_PASSWORD:?Задайте APP_DB_PASSWORD в .env.docker}@db:5432/music_store
  SECRET_KEY: ${SECRET_KEY:?Задайте SECRET_KEY в .env.docker}
  ALGORITHM: HS256
  ACCESS_TOKEN_EXPIRE_MINUTES: "30"

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Задайте POSTGRES_PASSWORD в .env.docker}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Задайте APP_DB_PASSWORD в .env.docker}
      MIGRATOR_DB_PASSWORD: ${MIGRATOR_DB_PASSWORD:?Задайте MIGRATOR_DB_PASSWORD в .env.docker}
    volumes:
      - pgdata:/var/lib/postgresql/data          # данные переживают пересоздание контейнера
      - ./docker/db/init:/docker-entrypoint-initdb.d:ro
    networks:
      - backend                                    # порт БД наружу не публикуется
    healthcheck:
      # Проверка по TCP: во время инициализации сервер слушает только сокет и не считается готовым
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 512M
        reservations:
          memory: 128M

  # Одноразовая задача: применяет миграции под ролью migrator и завершается
  migrate:
    image: music-store:${APP_VERSION:?Задайте APP_VERSION в .env.docker}
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      DATABASE_URL: postgresql+psycopg://migrator:${MIGRATOR_DB_PASSWORD:?Задайте MIGRATOR_DB_PASSWORD в .env.docker}@db:5432/music_store
      SECRET_KEY: ${SECRET_KEY:?Задайте SECRET_KEY в .env.docker}
    networks:
      - backend
    depends_on:
      db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M

  app1:
    <<: *app-common
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      <<: *app-environment
      INSTANCE_ID: app1

  app2:
    <<: *app-common
    environment:
      <<: *app-environment
      INSTANCE_ID: app2

  nginx:
    image: nginxinc/nginx-unprivileged:1.28-alpine   # nginx без root
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:8080"                      # единственный опубликованный порт
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - edge
      - backend
    depends_on:
      app1:
        condition: service_healthy
      app2:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/nginx-health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 64M

networks:
  edge: {}                # доступна снаружи, подключён только nginx
  backend:
    internal: true        # внутренняя сеть без выхода наружу: приложение и БД

volumes:
  pgdata: {}
