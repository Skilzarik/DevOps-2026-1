<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Музыкальный магазин - Прототип</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div id="auth-screen" class="container">
        <div class="auth-box">
            <h1>🎵 Музыкальный магазин</h1>
            <p class="subtitle">Демо-версия (данные хранятся локально)</p>
            
            <div class="tabs">
                <button class="tab-btn active" onclick="switchTab('login')">Вход</button>
                <button class="tab-btn" onclick="switchTab('register')">Регистрация</button>
            </div>

            <form id="login-form" class="form-section" onsubmit="handleLogin(event)">
                <input type="text" id="login-username" placeholder="Логин" required>
                <input type="password" id="login-password" placeholder="Пароль" required>
                <button type="submit" class="btn-primary">Войти</button>
                <p class="hint">Подсказка: зарегистрируйся первым!</p>
            </form>

            <form id="register-form" class="form-section hidden" onsubmit="handleRegister(event)">
                <input type="text" id="reg-username" placeholder="Логин" required>
                <input type="password" id="reg-password" placeholder="Пароль" required>
                <select id="reg-role" required>
                    <option value="admin">Администратор</option>
                    <option value="seller">Продавец</option>
                </select>
                <button type="submit" class="btn-primary">Зарегистрироваться</button>
            </form>
            <p id="auth-error" class="error-msg"></p>
        </div>
    </div>

    <div id="app-screen" class="container hidden">
        <header>
            <h2>Панель управления</h2>
            <div class="user-panel">
                <span id="user-info"></span>
                <button onclick="logout()" class="btn-secondary">Выйти</button>
            </div>
        </header>

        <main>
            <section id="musicians-section" class="card">
                <h3>🎤 Музыканты и ансамбли</h3>
                <form onsubmit="addMusician(event)" class="inline-form">
                    <input type="text" id="musician-name" placeholder="Имя / Название ансамбля" required>
                    <input type="text" id="musician-genre" placeholder="Жанр" required>
                    <button type="submit" class="btn-primary">Добавить</button>
                </form>
                <table id="musicians-table">
                    <thead>
                        <tr><th>ID</th><th>Имя</th><th>Жанр</th><th>Действия</th></tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </section>

            <section class="card">
                <h3>Каталог дисков</h3>
                    <form id="add-disc-form" onsubmit="addDisc(event)" class="inline-form">
                        <input type="text" id="disc-title" placeholder="Название диска" required>
                        <select id="disc-musician" required>
                            <option value="">Выберите музыканта</option>
                        </select>
                        <input type="number" id="disc-price" placeholder="Цена" step="0.01" min="0.01" required>
                        <input type="number" id="disc-stock" placeholder="Начальный остаток" min="0" required>
                        <button type="submit" class="btn-primary">Добавить</button>
                    </form>
                <table id="discs-table">
                    <thead>
                        <tr><th>ID</th><th>Название</th><th>Музыкант</th><th>Цена</th><th>Остаток</th><th>Действия</th></tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </section>

            <section class="card">
                <h3>Оформить продажу</h3>
                <form onsubmit="makeSale(event)" class="inline-form">
                    <select id="sale-disc" required>
                        <option value="">Выберите диск</option>
                    </select>
                    <input type="number" id="sale-qty" placeholder="Количество" min="1" required>
                    <button type="submit" class="btn-success">Продать</button>
                </form>
                <p id="sale-msg" class="info-msg"></p>
                
                <h4>История продаж</h4>
                <table id="sales-table">
                    <thead>
                        <tr><th>ID</th><th>Диск</th><th>Кол-во</th><th>Сумма</th><th>Дата</th></tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </section>
        </main>
    </div>

    <script src="/static/script.js"></script>
</body>
</html>
